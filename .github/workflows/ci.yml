name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests (offline, fake LLM, no OPENAI_API_KEY needed)
        run: pytest
      - name: Retrieval quality gate (offline BM25 eval on the real PDFs)
        run: python -m eval.run_eval --offline --min-hit5 0.9